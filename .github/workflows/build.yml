name: Build & Push Tinta Agent

on:
  push:
    branches: [main]
    tags: ["*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/tinta-lab/tinta-agent

# Third-party actions are pinned to full commit SHAs (a tag or branch like
# trivy-action@master can be moved to different code at any time); the
# comment next to each is the release it corresponds to.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Resolve version + channel ──────────────────────────────────────
      - name: Resolve version and channel
        id: meta
        run: |
          REF="${GITHUB_REF}"
          if [[ $REF == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
            # Only release-shaped tags may publish. Anything without "-beta"
            # used to count as stable, so a stray tag ("test", "v2026.10.0")
            # would have been built and pushed as :stable.
            #   stable: 2026.10.0            (no "v" — image tag == git tag)
            #   beta:   [v]2026.10.0-beta[.N]
            if [[ $VERSION =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
              CHANNEL="stable"
            elif [[ $VERSION =~ ^v?[0-9]{4}\.[0-9]{1,2}\.[0-9]+-beta(\.[0-9]+)?$ ]]; then
              CHANNEL="beta"
            else
              echo "::error::Tag '$VERSION' is not a release tag (YYYY.M.N or [v]YYYY.M.N-beta[.N]); not publishing anything."
              exit 1
            fi
            # major.minor alias: 2026.4.1 → 2026.4 — stable only. A beta tag
            # (2026.4.1-beta) strips to the exact same "2026.4" via %.* as a
            # real stable 2026.4.1 would, so without this gate an RC build
            # silently overwrote the alias real installs could be pinned to
            # with unverified content (found during the 2026.9.2 RC).
            if [[ $CHANNEL == "stable" ]]; then
              MINOR_ALIAS="${VERSION%.*}"
            else
              MINOR_ALIAS=""
            fi
          else
            VERSION="dev"
            CHANNEL="dev"
            MINOR_ALIAS=""
          fi
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL"     >> $GITHUB_OUTPUT
          echo "minor_alias=$MINOR_ALIAS" >> $GITHUB_OUTPUT
          echo "Channel: $CHANNEL  Version: $VERSION"

      # ── Build & push multi-arch ────────────────────────────────────────
      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./tinta_agent
          file: ./tinta_agent/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.channel }}
            ${{ steps.meta.outputs.minor_alias != '' && format('{0}:{1}', env.IMAGE, steps.meta.outputs.minor_alias) || '' }}
          labels: |
            org.opencontainers.image.title=Tinta Agent
            org.opencontainers.image.description=Tinta Lab Home Assistant Agent
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/tinta-lab/tinta-agent
            org.opencontainers.image.licenses=UNLICENSED

  # ── Security scan (amd64 manifest) ──────────────────────────────────
  # Separate job so the third-party scanner never runs with the
  # packages: write token that can publish images. The image is public, so
  # pulling it needs no credentials.
  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for trivy SARIF upload

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'           # don't fail build, just report

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true   # SARIF upload requires Advanced Security (may not be available on org)
